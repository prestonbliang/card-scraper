name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Core deps only. The optional extras (scrapling, anthropic, datasets)
      # are deliberately NOT installed here: the suite must pass without a
      # model provider, without network, and without the stealth fetch stack,
      # because that is how most people will first run it. If a test starts
      # needing one of them, that is a regression in the test, not a missing
      # dependency in CI.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 .

      - name: Test
        run: pytest tests/ -q

      # Proves the documented quickstart actually works from nothing, which is
      # the failure users hit first and contributors never notice.
      - name: End-to-end smoke test
        run: |
          python -m seed.generate_synthetic data/corpus/synthetic.docx
          python -m seed.build_outline seed/moratorium_outline.yaml data/corpus/skeleton.docx
          python -m cardgraph.cli ingest local data/corpus
          python -m cardgraph.cli graph
          python -m cardgraph.cli search "households subsidize industrial load"
          CARDGRAPH_LLM=none python -m cardgraph.cli analyze --top 3
