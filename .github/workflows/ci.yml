name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff

      - name: Run regression suite
        run: python -m pytest tests/ -q

      - name: Run lint checks
        run: ruff check cardgraph tests

      - name: Check Python compilation
        run: python -m compileall -q cardgraph tests

      - name: Run documented end-to-end smoke test
        run: |
          python -m seed.generate_synthetic data/corpus/synthetic.docx
          python -m seed.build_outline seed/moratorium_outline.yaml data/corpus/skeleton.docx
          python -m cardgraph.cli ingest local data/corpus
          python -m cardgraph.cli graph
          python -m cardgraph.cli search "households subsidize industrial load"
          CARDGRAPH_LLM=none python -m cardgraph.cli analyze --top 3

      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify wheel contains the application UI and license
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "wheel was not created"
          with ZipFile(wheels[-1]) as wheel:
              names = set(wheel.namelist())
          assert any(name.endswith("/LICENSE") for name in names), "license missing from wheel"
          assert any(name.endswith("/index.html") for name in names), "web UI missing from wheel"
          print(f"validated {wheels[-1].name}")
          PY
