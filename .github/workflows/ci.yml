name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run regression suite
        run: python -m pytest tests/ -q

      - name: Run lint checks
        run: python -m ruff check --select E9,F63,F7,F82,F401,F811,F841 .

      - name: Check Python compilation
        run: python -m compileall -q cardgraph tests

      - name: Run documented end-to-end smoke test
        run: |
          python -m seed.generate_synthetic data/corpus/synthetic.docx
          python -m seed.build_outline seed/moratorium_outline.yaml data/corpus/skeleton.docx
          python -m cardgraph.cli ingest local data/corpus
          python -m cardgraph.cli graph
          python -m cardgraph.cli search "households subsidize industrial load"
          CARDGRAPH_LLM=none python -m cardgraph.cli analyze --top 3

      - name: Exercise the live HTTP server
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import time
          import urllib.request

          command = [
              sys.executable, "-m", "cardgraph.cli", "--db", "data/cardgraph.db", "serve",
              "--host", "127.0.0.1", "--port", "8765",
          ]
          process = subprocess.Popen(command, stdout=subprocess.PIPE,
                                     stderr=subprocess.STDOUT, text=True)
          try:
              deadline = time.time() + 30
              health = None
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:8765/api/health", timeout=2) as response:
                          health = json.load(response)
                      break
                  except (OSError, ValueError):
                      time.sleep(0.25)
              assert health and health["status"] == "ok", health
              with urllib.request.urlopen("http://127.0.0.1:8765/", timeout=5) as response:
                  assert response.status == 200
                  assert "Card Scraper" in response.read().decode("utf-8")
              with urllib.request.urlopen("http://127.0.0.1:8765/api/search?q=households", timeout=5) as response:
                  assert json.load(response)["count"] >= 1
              print("live HTTP smoke passed")
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
          PY

      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify wheel contains the application UI and license
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "wheel was not created"
          with ZipFile(wheels[-1]) as wheel:
              names = set(wheel.namelist())
          assert any(name.endswith("/LICENSE") for name in names), "license missing from wheel"
          assert any(name.endswith("/index.html") for name in names), "web UI missing from wheel"
          print(f"validated {wheels[-1].name}")
          PY
