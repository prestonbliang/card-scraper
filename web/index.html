<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Scraper — debate evidence index</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%232f5d50%27/%3E%3Crect x=%273%27 y=%275%27 width=%2710%27 height=%272%27 fill=%27%23fff3bf%27/%3E%3Crect x=%273%27 y=%279%27 width=%276%27 height=%272%27 fill=%27%23fff3bf%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b66; --line:#e3e2de;
  --accent:#2f5d50; --accent-soft:#e8f0ed; --read:#fff3bf; --emph:#ffd43b;
  --aff:#2f5d50; --neg:#8a3324; --warn:#9a6700; --warn-bg:#fff8e1;
  --panel-alt:#f4f6f3; --shadow:0 10px 30px rgba(26,26,25,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#16171a; --panel:#1d1f23; --ink:#e8e6e3; --muted:#9a9791; --line:#2e3137;
    --accent:#7fb3a1; --accent-soft:#22302b; --read:#3d3517; --emph:#5c4d10;
    --aff:#7fb3a1; --neg:#d99177; --warn:#d9a441; --warn-bg:#2b2410;
    --panel-alt:#25282c; --shadow:0 10px 30px rgba(0,0,0,.18);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}

header{
  display:flex;align-items:center;gap:16px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:10;flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.brand{font-weight:700;letter-spacing:-.02em;font-size:16px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.searchwrap{flex:1;min-width:300px;display:flex;flex-direction:column;gap:6px}
.search-main{display:flex;gap:8px;align-items:center}
.search-main input[type=search]{min-width:0}
.search-help{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.query-example{border:0;background:transparent;color:var(--accent);padding:0;font:inherit;font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.query-example:hover{color:var(--ink)}
.shortcut-hint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.recent-searches{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.recent-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.recent-head h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.recent-clear{border:0;background:transparent;color:var(--muted);font-size:11px;text-decoration:underline;padding:0}
.recent-clear:hover{color:var(--accent)}
.recent-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.recent-query{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 10px;font-size:12px;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-query:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.advanced{font-size:12px;color:var(--muted)}
.advanced summary{cursor:pointer;display:inline-block;padding:2px 0;user-select:none}
.advanced summary:hover{color:var(--accent)}
.filters{display:flex;gap:7px;flex-wrap:wrap;padding:5px 0 1px}
.filter-number{width:82px;min-width:0!important}
.filter-block{min-width:150px!important}
.clearbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:7px 9px;font-size:16px;line-height:1}
.clearbtn:hover{color:var(--ink);border-color:var(--accent)}
.copybtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:8px 10px;font-size:12px;white-space:nowrap}
.copybtn:hover{color:var(--accent);border-color:var(--accent)}
.detail-share{margin:8px 0 2px}
.filter-clear{border:0;background:transparent;color:var(--muted);padding:6px 4px;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.filter-clear:hover{color:var(--accent)}
input[type=search],select{
  font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);
}
.searchbtn{border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:7px;padding:8px 13px;font-weight:600}
.searchbtn:hover{filter:brightness(1.08)}
.smart-toggle{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.smart-toggle input{accent-color:var(--accent)}
.mode-picker{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mode-select{padding:4px 6px;font-size:11px}
input[type=search]{flex:1}
input[type=search]:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.stats{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

main{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 58px)}
@media(max-width:900px){main{grid-template-columns:1fr}#tree{display:none}}

#tree{border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;
      max-height:calc(100vh - 58px);position:sticky;top:58px;background:var(--panel)}
.treehdr{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
         color:var(--muted);padding:0 8px 8px;font-weight:600}
#treeFilter{width:calc(100% - 12px);margin:0 6px 6px;padding:6px 9px;font-size:12.5px}
#treecount{font-family:var(--mono);font-size:10.5px;color:var(--muted);
           padding:0 8px 6px}
.more{padding:5px 8px;margin-top:2px;border-radius:6px;cursor:pointer;
      font-size:12px;color:var(--accent);font-family:var(--mono)}
.more:hover{background:var(--accent-soft)}
.node{padding:4px 8px;border-radius:6px;cursor:pointer;display:flex;gap:6px;
      align-items:baseline;line-height:1.35}
.node:hover{background:var(--accent-soft)}
.node.sel{background:var(--accent-soft);font-weight:600}
.twisty{width:12px;flex:none;color:var(--muted);font-size:10px;user-select:none}
.node .ttl{flex:1;overflow:hidden;text-overflow:ellipsis}
.node .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.kids{margin-left:12px;border-left:1px solid var(--line);padding-left:4px}
.at-node .ttl{color:var(--neg)}

#content{padding:20px 24px;max-width:900px}
body.analysis #content{max-width:1180px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:14px;font-family:var(--mono)}
.empty{color:var(--muted);padding:40px 0;max-width:56ch}
.empty h2{font-size:15px;color:var(--ink);margin:0 0 8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px;line-height:1.4;font-weight:650;cursor:pointer}
.card h3:hover{color:var(--accent)}
.card-title-row{display:flex;align-items:flex-start;gap:10px}
.card-title-row h3{flex:1}
.pin-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap}
.pin-btn:hover,.pin-btn.pinned{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.board-toolbar h2{font-size:18px;margin:0}
.board-actions{display:flex;gap:7px;flex-wrap:wrap}
.board-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:7px 10px;font-size:12px}
.board-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.board-btn:hover{border-color:var(--accent);color:var(--accent)}
.board-btn.primary:hover{color:#fff}
.board-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.board-column{min-width:0}
.board-column h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 9px}
.board-column .card{margin-bottom:9px;padding:11px 12px}
.board-column .read{font-size:14px}
.board-card{cursor:grab}
.board-card:active{cursor:grabbing}
.board-note{width:100%;min-height:54px;resize:vertical;margin-top:9px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:12px/1.4 var(--sans)}
.board-note:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
@media(max-width:700px){.board-columns{grid-template-columns:1fr}}
.source-line{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.source-line a{font-family:var(--mono);font-size:10.5px}
.source-tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--panel-alt);color:var(--muted)}
.read{font-family:var(--serif);font-size:15.5px;line-height:1.6;
      background:var(--read);padding:2px 0;box-decoration-break:clone}
.readbox{margin:8px 0 0}
.search-hit{background:var(--emph);color:var(--ink);padding:0 2px;border-radius:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pill{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:99px;
      border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.aff{color:var(--aff);border-color:var(--aff)}
.pill.neg{color:var(--neg);border-color:var(--neg)}
.pill.flag{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.pill.rank{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.confidence-badge{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:99px;white-space:nowrap;border:1px solid}
.confidence-badge.high{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.confidence-badge.medium{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.confidence-badge.exploratory{color:var(--muted);border-color:var(--line);background:var(--panel-alt)}
.evidence-badge{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:99px;white-space:nowrap;border:1px solid}
.evidence-badge.traceable{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.evidence-badge.attributed{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.evidence-badge.needs-review{color:var(--neg);border-color:var(--neg);background:color-mix(in srgb,var(--neg) 10%,transparent)}
.freshness-badge{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:99px;white-space:nowrap;border:1px solid}
.freshness-badge.fresh{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.freshness-badge.stale,.freshness-badge.refresh-failed{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.freshness-badge.unknown{color:var(--muted);border-color:var(--line);background:var(--panel-alt)}

.detail .body{font-family:var(--serif);font-size:15px;line-height:1.65;
              color:var(--muted);margin-top:10px}
.detail .body mark{background:var(--read);color:var(--ink);padding:1px 0}
.detail .body mark.e{background:var(--emph);font-weight:600}
.toggle{display:flex;gap:6px;margin:12px 0 4px}
.toggle button{background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted)}
.toggle button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
h4.sec{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
       color:var(--muted);margin:22px 0 8px;font-weight:600}
.edge{padding:7px 10px;border:1px solid var(--line);border-radius:7px;
      margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.edge:hover{background:var(--accent-soft)}
.edge .conf{font-family:var(--mono);font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);background:var(--warn-bg);
      border:1px solid var(--warn);border-radius:7px;padding:9px 11px;margin:10px 0}
.spin{color:var(--muted);padding:20px 0}

/* analysis */
.modes{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:2px}
.modes button{background:transparent;border:0;border-radius:6px;padding:5px 12px;
  font-size:12.5px;color:var(--muted)}
.modes button[aria-pressed=true]{background:var(--accent);color:#fff}
.abar{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.astat{display:flex;flex-direction:column;gap:2px}
.astat b{font-size:19px;font-weight:650;line-height:1.1}
.astat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pos{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:14px}
.pos h3{margin:0 0 3px;font-size:15.5px;font-weight:650}
.posmeta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px}
.bars{display:flex;gap:14px;margin:8px 0 12px;flex-wrap:wrap}
.bar{flex:1;min-width:150px}
.bar label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:3px}
.fill.sup{background:var(--aff)} .fill.exp{background:var(--neg)}
.thesis{font-family:var(--serif);font-size:14.5px;line-height:1.55;
  border-left:3px solid var(--accent);padding-left:11px;margin:10px 0;color:var(--ink)}
.verdict{font-size:13.5px;line-height:1.6;background:var(--accent-soft);
  border-radius:8px;padding:11px 13px;margin:10px 0}
.chain{margin:12px 0}
.step{display:flex;gap:10px;padding:7px 9px;border-radius:7px;margin-bottom:4px;
  align-items:flex-start;border:1px solid transparent}
.step .st{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:4px;flex:none;margin-top:1px;letter-spacing:.04em}
.step.supported .st{background:var(--accent-soft);color:var(--accent)}
.step.weak{background:var(--warn-bg);border-color:var(--warn)}
.step.weak .st{background:var(--warn);color:#fff}
.step.missing{background:color-mix(in srgb,var(--neg) 9%,transparent);border-color:var(--neg)}
.step.missing .st{background:var(--neg);color:#fff}
.step .claim{flex:1;font-size:13.5px;line-height:1.45}
.step .note{font-size:12px;color:var(--muted);margin-top:3px}
.step .cids{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px}
.find{border-left:3px solid var(--line);padding:8px 0 8px 11px;margin:9px 0}
.find.critical{border-color:#b3261e} .find.major{border-color:var(--neg)}
.find.minor{border-color:var(--warn)} .find.info{border-color:var(--line)}
.find .ft{font-weight:600;font-size:13.5px;display:flex;gap:7px;align-items:baseline}
.find .ft>*:not(.sevtag){flex:1;min-width:0}
.find .fd{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.find .fx{font-size:12.5px;margin-top:5px}
.find .fx b{color:var(--accent);font-weight:600}
.sevtag{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.07em;padding:1px 6px;border-radius:3px;color:#fff;flex:none}
.sevtag.critical{background:#b3261e} .sevtag.major{background:var(--neg)}
.sevtag.minor{background:var(--warn)} .sevtag.info{background:var(--muted)}
.ungrounded{font-family:var(--mono);font-size:10px;color:var(--warn);
  border:1px solid var(--warn);border-radius:3px;padding:0 5px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;margin-bottom:10px}
.blk h4{margin:0 0 5px;font-size:14px;font-weight:650}
.blk .arg{font-size:13px;line-height:1.5;color:var(--muted)}
.cov{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:99px;
  display:inline-block;margin-top:8px}
.cov.none{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.cov.partial{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.cov.have{background:var(--accent-soft);color:var(--accent)}
.q{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;
  word-break:break-word}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.source-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.source-card h3{margin:0 0 5px;font-size:15px}
.source-card .source-kind{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:8px}
.source-card p{font-size:12.5px;color:var(--muted);margin:8px 0;line-height:1.45}
.source-card .source-command{font-family:var(--mono);font-size:10.5px;background:var(--panel-alt);padding:7px 8px;border-radius:6px;word-break:break-word}
.source-card.gated{border-color:var(--warn)}
.source-card.gated .source-access{color:var(--warn)}
.source-access{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--accent);letter-spacing:.06em}
.ingest-panel{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:14px;margin:14px 0 18px}
.ingest-panel h3{margin:0 0 5px;font-size:14px}
.ingest-panel p{margin:0 0 10px;color:var(--muted);font-size:12px}
.ingest-form{display:flex;gap:7px;flex-wrap:wrap}
.ingest-form input{flex:1;min-width:240px}
.ingest-status{margin-top:9px;font-size:12px;color:var(--muted)}
.source-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.workspace-actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.workspace-actions input[type=file]{max-width:240px;font-size:11px;color:var(--muted)}
.source-health{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:7px}
.import-history{margin:18px 0}.import-history h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.import-job{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px}
.import-job .state{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="brand">Card Scraper<span>debate evidence index</span></div>
  <div class="searchwrap">      <div class="search-main">

      <input type="search" id="q" placeholder="Try: nuclear power, or negative cards from 2024…" autocomplete="off" aria-label="Search cards and arguments">
      <label class="smart-toggle" title="Understand conversational wording and debate synonyms">
        <input type="checkbox" id="smartSearch" checked> Smart
      </label>
      <button class="clearbtn" id="clearSearch" type="button" aria-label="Clear search">×</button>
      <button class="searchbtn" id="searchBtn">Search</button>
      <button class="copybtn" id="copyLink" type="button" title="Copy a link to this search">Copy link</button>
    </div>
    <div class="search-help">
      <span>Try</span>
      <button class="query-example" type="button" data-query="negative cards from 2024 about nuclear power">negative cards from 2024 about nuclear power</button>
      <span>or</span>
      <button class="query-example" type="button" data-query="household costs">household costs</button>
      <span class="search-hint">Use “from 2024” or “negative cards” in the search itself.</span>
      <span class="shortcut-hint">Press / to focus · Esc to clear</span>
      <details class="advanced">
        <summary id="filterSummary">Filters</summary>
        <div class="filters">
          <label class="mode-picker">Search mode
            <select id="searchMode" class="mode-select" aria-label="Search precision">
              <option value="balanced" selected>Balanced</option>
              <option value="strict">Exact</option>
              <option value="explore">Explore</option>
            </select>
          </label>
          <select id="side" aria-label="Filter by side">
            <option value="">Any side</option><option value="aff">Affirmative</option>
            <option value="neg">Negative</option><option value="unknown">Unclassified</option>
          </select>
          <input type="search" id="source" placeholder="Source or school" autocomplete="off" aria-label="Filter by source">

<script>
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (p, opts = {}) => {
  const r = await fetch(p, opts);
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok){
    const detail = data && data.detail ? data.detail : `request failed (${r.status})`;
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return data;
};

function workspaceState(){
  return {pinned: PINNED, pinned_order: orderedPinned(), recent_searches: getRecentSearches()};
}

function applyWorkspaceState(state){
  if (!state || typeof state !== "object") return;
  if (state.pinned && typeof state.pinned === "object") PINNED = state.pinned;
  if (Array.isArray(state.pinned_order)) PINNED_ORDER = state.pinned_order;
  savePinned();
  if (Array.isArray(state.recent_searches)) {
    try { localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(state.recent_searches.slice(0, 100))); } catch (_) {}
  }
}

async function exportWorkspace(){
  const response = await fetch("/api/workspace/export", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({browser_state: workspaceState(), include_corpus: true}),
  });
  if (!response.ok) throw new Error(`workspace export failed (${response.status})`);
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.href = url; link.download = "card-scraper-workspace.zip";
  link.click(); URL.revokeObjectURL(url);
}

async function inspectWorkspace(file){
  const response = await fetch("/api/workspace/inspect", {
    method: "POST", headers: {"Content-Type": "application/zip"}, body: file,
  });
  let result = null; try { result = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(result && result.detail ? result.detail : `workspace validation failed (${response.status})`);
  return result;
}

async function restoreWorkspace(file){
  const response = await fetch("/api/workspace/restore", {
    method: "POST", headers: {"Content-Type": "application/zip"}, body: file,
  });
  let result = null; try { result = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(result && result.detail ? result.detail : `workspace restore failed (${response.status})`);
  applyWorkspaceState(result.browser_state);
  APP_STATS = result.stats;
  $("#stats").textContent = `${result.stats.cards} cards · ${result.stats.nodes} nodes · ${result.stats.edges} edges · ${result.stats.sources} sources`;
  $("#treebody").innerHTML = ""; await loadTree(null, $("#treebody"), 0);
  return result;
}
let viewRequest = 0;
const showError = (target, err) => {
  target.innerHTML = "";
  target.append(el("div", "note", `Could not load this view: ${err.message || err}`));
};

/* ---------- read-text reconstruction -------------------------------------
   We store body and read_text separately, joined by an elision marker. To show
   the card the way a debater sees it, locate each read fragment inside the body
   and mark it. Fragments are matched on normalized whitespace; a fragment that
   does not locate is appended rather than dropped, so nothing is silently lost.
------------------------------------------------------------------------- */
function renderBodyWithMarks(body, readText, emphText){
  if (!body) return esc(readText || "");
  if (!readText) return esc(body);
  const frags = readText.split(" … ").map(f => f.trim()).filter(f => f.length > 8);
  const emph  = new Set((emphText||"").split(" … ").map(f => f.trim()).filter(Boolean));
  const spans = [];
  let cursor = 0;
  for (const f of frags){
    const at = body.indexOf(f, cursor);
    if (at === -1) continue;
    spans.push([at, at + f.length, emph.has(f)]);
    cursor = at + f.length;
  }
  if (!spans.length) return esc(body);
  let out = "", pos = 0;
  for (const [s, e, isE] of spans){
    out += esc(body.slice(pos, s));
    out += `<mark class="${isE ? 'e' : ''}">${esc(body.slice(s, e))}</mark>`;
    pos = e;
  }
  return out + esc(body.slice(pos));
}

/* ---------- card rendering ---------- */
const PINNED_KEY = "card-scraper:pinned-cards";
const PINNED_ORDER_KEY = "card-scraper:pinned-order";
let PINNED = {};
let PINNED_ORDER = [];
try { PINNED = JSON.parse(localStorage.getItem(PINNED_KEY) || "{}"); } catch (_) { PINNED = {}; }
try { PINNED_ORDER = JSON.parse(localStorage.getItem(PINNED_ORDER_KEY) || "[]"); } catch (_) { PINNED_ORDER = []; }

function orderedPinned(){
  const ids = Object.keys(PINNED);
  const known = PINNED_ORDER.filter(id => PINNED[id]);
  return [...known, ...ids.filter(id => !known.includes(id))];
}

function savePinned(){
  PINNED_ORDER = orderedPinned();
  try {
    localStorage.setItem(PINNED_KEY, JSON.stringify(PINNED));
    localStorage.setItem(PINNED_ORDER_KEY, JSON.stringify(PINNED_ORDER));
  } catch (_) {}
  $("#boardCount").textContent = Object.keys(PINNED).length ? `(${Object.keys(PINNED).length})` : "";
}

function pinButton(c){
  const pinned = Boolean(PINNED[c.card_id]);
  const button = el("button", "pin-btn" + (pinned ? " pinned" : ""), pinned ? "Pinned" : "Pin");
  button.type = "button";
  button.setAttribute("aria-pressed", String(pinned));
  button.title = pinned ? "Remove from research board" : "Add to research board";
  button.onclick = (event) => {
    event.stopPropagation();
    if (PINNED[c.card_id]) {
      delete PINNED[c.card_id];
      PINNED_ORDER = PINNED_ORDER.filter(id => id !== c.card_id);
    } else {
      PINNED[c.card_id] = {...c};
      PINNED_ORDER.push(c.card_id);
    }
    savePinned();
    button.classList.toggle("pinned", Boolean(PINNED[c.card_id]));
    button.textContent = PINNED[c.card_id] ? "Pinned" : "Pin";
    button.setAttribute("aria-pressed", String(Boolean(PINNED[c.card_id])));
    button.title = PINNED[c.card_id] ? "Remove from research board" : "Add to research board";
    if (MODE === "board") showBoard();
  };
  return button;
}

function highlightedRead(text, reasons){
  const terms = (reasons || []).filter(reason => reason.startsWith("exact:"))
    .flatMap(reason => reason.slice(6).split(",").map(term => term.trim()))
    .filter((term, index, all) => term.length >= 2 && all.indexOf(term) === index);
  const root = el("span", "read");
  if (!terms.length){ root.textContent = text || ""; return root; }
  const pattern = new RegExp(`(${terms.map(term => term.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&")).join("|")})`, "gi");
  text.split(pattern).forEach(part => {
    if (terms.some(term => part.toLowerCase() === term.toLowerCase())) root.append(el("mark", "search-hit", part));
    else root.append(document.createTextNode(part));
  });
  return root;
}

function cardEl(c, opts = {}){
  const n = el("div", "card");
  const title = el("div", "card-title-row");
  const h = el("h3", null, c.tag);
  h.onclick = () => showCard(c.card_id);
  title.append(h, pinButton(c));
  n.append(title);
  if (c.cite_raw) n.append(el("div", "cite", c.cite_raw));
  if (c.source_title || c.source_origin){
    const line = el("div", "source-line");
    line.append(el("span", "source-tag", c.source_origin || "online"));
    line.append(document.createTextNode(c.source_title || c.source_id || ""));
    if (c.source_url){
      const a = el("a", null, "open source");
      a.href = c.source_url; a.target = "_blank"; a.rel = "noreferrer";
      line.append(a);
    }
    n.append(line);
  }
  if (c.read_text){
    const rb = el("div", "readbox");
    rb.append(highlightedRead(c.read_text, c.match_reasons));
    n.append(rb);
  }
  const m = el("div", "meta");
  if (c.side && c.side !== "unknown") m.append(el("span", "pill " + c.side, c.side));
  if (c.block) m.append(el("span", "pill", c.block));
  (c.warrant_flags || []).forEach(f => m.append(el("span", "pill flag", f.replace(/_/g," "))));
  if (c.source_freshness){
    const labels = {fresh: "Fresh source", stale: "Stale source", "refresh-failed": "Refresh failed", unknown: "Freshness unknown"};
    const badge = el("span", "freshness-badge " + c.source_freshness,
      labels[c.source_freshness] || c.source_freshness);
    badge.title = c.source_freshness === "stale"
      ? `This source has not been refreshed recently${c.source_age_days != null ? ` (${c.source_age_days} days old)` : ""}. Verify currentness before cutting.`
      : c.source_freshness === "refresh-failed"
        ? `The latest refresh failed. The displayed card is the last-known-good copy. ${c.source_refresh_error || ""}`
        : c.source_freshness === "fresh" ? "This source is within its freshness window." : "No reliable fetch timestamp is available for this source.";
    m.append(badge);
  }
  if (c.evidence_status){
    const labels = {traceable: "Traceable evidence", attributed: "Attributed", "needs-review": "Needs review"};
    const badge = el("span", "evidence-badge " + c.evidence_status,
      labels[c.evidence_status] || c.evidence_status);
    badge.title = c.evidence_status === "traceable"
      ? "The result has a citation, source identity, and read text or disclosed text. This describes traceability, not factual correctness or redistribution rights."
      : c.evidence_status === "attributed"
        ? "The result has a citation and source identity, but no parsed read text. Verify it against the original before relying on it."
        : "The result is missing citation or source metadata. Treat it as a lead, not ready-to-cut evidence.";
    m.append(badge);
  }
  if (c.confidence){
    const labels = {high: "High confidence", medium: "Strong match", exploratory: "Explore match"};
    const badge = el("span", "confidence-badge " + c.confidence,
      labels[c.confidence] || c.confidence);
    badge.title = c.match_type === "exact"
      ? "Exact terms found in the card and ranked lexically. This is a retrieval signal, not a claim that the evidence is correct."
      : c.match_type === "hybrid"
        ? "Lexical and semantic retrieval both found this card."
        : "Found through semantic similarity; verify the card text before relying on it.";
    m.append(badge);
  }
  if (opts.rank) m.append(el("span", "pill rank",
    `lex ${c.lexical_rank ?? "—"} · vec ${c.vector_rank ?? "—"}`));
  if (m.children.length) n.append(m);
  if (c.matched_queries && c.matched_queries.length){
    n.append(el("div", "q", `matched: ${c.matched_queries.join(" · ")}`));
  }
  if (c.match_reasons && c.match_reasons.length){
    n.append(el("div", "q", `why: ${c.match_reasons.join(" · ")}`));
  }
  return n;
}

async function copyUrlToClipboard(button, {sync = true} = {}){
  if (sync) syncUrl();
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(location.href);
    } else {
      const field = document.createElement("textarea");
      field.value = location.href; field.setAttribute("readonly", "");
      field.style.position = "fixed"; field.style.opacity = "0";
      document.body.append(field); field.select();
      if (!document.execCommand("copy")) throw new Error("copy unavailable");
      field.remove();
    }
    button.textContent = "Copied!";
  } catch (_) {
    button.textContent = "Link ready";
  }
  setTimeout(() => { button.textContent = "Copy link"; }, 1400);
}

function boardText(card){
  const side = card.side === "aff" ? "Affirmative" : card.side === "neg" ? "Negative" : "Unclassified";
  return `- ${card.tag || "Untitled"} [${side}]\n  Citation: ${card.cite_raw || "not available"}\n  Source: ${card.source_title || card.source_id || "not recorded"}${card.source_url ? ` — ${card.source_url}` : ""}\n  Read text: ${card.read_text || "(no read text parsed)"}\n  Private note: ${card.note || "(none)"}`;
}

function exportBoard(){
  const cards = orderedPinned().map(id => PINNED[id]);
  const groups = [["Affirmative", cards.filter(c => c.side === "aff")], ["Negative", cards.filter(c => c.side === "neg")], ["Unclassified", cards.filter(c => !["aff", "neg"].includes(c.side))]];
  const text = [
    "# Card Scraper research board", "",
    "Pinned evidence for review — retrieval metadata is not a factual verdict.", "",
    ...groups.flatMap(([name, items]) => {
      const body = items.length ? items.flatMap(c => [boardText(c), ""]) : ["(none)", ""];
      return [`## ${name}`, "", ...body];
    }),
  ].join("\n");
  const blob = new Blob([text], {type: "text/markdown;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "card-scraper-research-board.md";
  a.click(); URL.revokeObjectURL(url);
}

function reorderPinned(draggedId, targetId){
  const order = orderedPinned().filter(id => id !== draggedId);
  const at = order.indexOf(targetId);
  order.splice(at < 0 ? order.length : at, 0, draggedId);
  PINNED_ORDER = order;
  savePinned();
  showBoard();
}

function boardCardEl(card){
  const node = cardEl(card);
  node.classList.add("board-card");
  node.draggable = true;
  node.dataset.cardId = card.card_id;
  node.addEventListener("dragstart", event => {
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", card.card_id);
  });
  node.addEventListener("dragover", event => { event.preventDefault(); event.dataTransfer.dropEffect = "move"; });
  node.addEventListener("drop", event => {
    event.preventDefault();
    const dragged = event.dataTransfer.getData("text/plain");
    if (dragged && dragged !== card.card_id) reorderPinned(dragged, card.card_id);
  });
  const note = document.createElement("textarea");
  note.className = "board-note";
  note.placeholder = "Private note for this card…";
  note.value = card.note || "";
  note.setAttribute("aria-label", `Private note for ${card.tag || "card"}`);
  note.addEventListener("input", () => {
    if (PINNED[card.card_id]) { PINNED[card.card_id].note = note.value; savePinned(); }
  });
  note.addEventListener("click", event => event.stopPropagation());
  node.append(note);
  return node;
}

function showBoard(){
  const request = ++viewRequest;
  const c = $("#content"); c.innerHTML = "";
  const cards = orderedPinned().map(id => PINNED[id]);
  const toolbar = el("div", "board-toolbar");
  toolbar.append(el("h2", null, "Research board"));
  const actions = el("div", "board-actions");
  const exportButton = el("button", "board-btn primary", "Export cited brief");
  exportButton.type = "button"; exportButton.disabled = !cards.length; exportButton.onclick = exportBoard;
  const workspaceButton = el("button", "board-btn", "Export workspace");
  workspaceButton.type = "button"; workspaceButton.title = "Download the index, evidence files, pins, notes, and recent searches";
  workspaceButton.onclick = async () => { workspaceButton.disabled = true; workspaceButton.textContent = "Preparing…"; try { await exportWorkspace(); workspaceButton.textContent = "Workspace exported"; } catch (err) { workspaceButton.textContent = err.message || "Export failed"; } finally { setTimeout(() => { workspaceButton.disabled = false; workspaceButton.textContent = "Export workspace"; }, 1800); } };
  const clear = el("button", "board-btn", "Clear board");
  clear.type = "button"; clear.disabled = !cards.length;
  clear.onclick = () => { PINNED = {}; PINNED_ORDER = []; savePinned(); showBoard(); };
  actions.append(exportButton, workspaceButton, clear); toolbar.append(actions); c.append(toolbar);
  if (!cards.length){
    const empty = el("div", "empty");
    empty.append(el("h2", null, "Your board is empty."));
    empty.append(el("p", null, "Pin cards from search results to compare affirmative and negative evidence here. Pins stay in this browser only."));
    c.append(empty); return;
  }
  c.append(el("p", "q", `${cards.length} pinned card${cards.length === 1 ? "" : "s"} · stored locally in this browser`));
  const columns = el("div", "board-columns");
  [["Affirmative", "aff"], ["Negative", "neg"], ["Unclassified", "unknown"]].forEach(([label, side]) => {
    const column = el("section", "board-column");
    const items = cards.filter(card => (card.side || "unknown") === side);
    column.append(el("h3", null, `${label} · ${items.length}`));
    items.forEach(card => column.append(boardCardEl(card)));
    columns.append(column);
  });
  c.append(columns);
}

function detailShare(kind, id){
  const button = el("button", "copybtn detail-share", "Copy link");
  button.type = "button";
  button.title = `Copy a link to this ${kind}`;
  button.onclick = () => {
    syncUrl({[kind]: id});
    copyUrlToClipboard(button, {sync: false});
  };
  return button;
}

/* ---------- search ---------- */
$("#side").addEventListener("change", () => { updateFilterSummary(); doSearch({pushUrl: true}); });
$("#source").addEventListener("input", updateFilterSummary);
$("#block").addEventListener("input", updateFilterSummary);
$("#smartSearch").addEventListener("change", () => {
  if ($("#q").value.trim()) doSearch({pushUrl: true});
});
$("#searchMode").addEventListener("change", () => doSearch({pushUrl: true}));
$("#searchBtn").addEventListener("click", () => doSearch({pushUrl: true}));
$("#copyLink").addEventListener("click", () => copyUrlToClipboard($("#copyLink")));
$("#clearSearch").addEventListener("click", () => {
  $("#q").value = "";
  syncUrl({pushUrl: true});
  renderWelcome();
  $("#q").focus();
});
$("#clearFilters").addEventListener("click", () => {
  $("#side").value = "";
  $("#source").value = "";
  $("#block").value = "";
  updateFilterSummary();
  if ($("#q").value.trim()) doSearch({pushUrl: true});
  else syncUrl({pushUrl: true});
});
document.addEventListener("keydown", e => {
  const active = document.activeElement;
  const typing = active && (active.matches("input, textarea, select") || active.isContentEditable);
  if (e.key === "/" && !typing){
    e.preventDefault(); $("#q").focus();
  }
  if (e.key === "Escape" && $("#q").value && (typing || MODE === "search")){
    $("#q").value = "";
    syncUrl({pushUrl: true});
    renderWelcome();
  }
});

document.querySelectorAll(".query-example").forEach(button => {
  button.addEventListener("click", () => {
    $("#q").value = button.dataset.query || "";
    doSearch({pushUrl: true});
    $("#q").focus();
  });
});

$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch({pushUrl: true}); });
$("#source").addEventListener("keydown", e => { if (e.key === "Enter") doSearch({pushUrl: true}); });
$("#block").addEventListener("keydown", e => { if (e.key === "Enter") doSearch({pushUrl: true}); });

function updateFilterSummary(){
  const count = [$("#side").value, $("#source").value.trim(), $("#block").value.trim()]
    .filter(Boolean).length;
  $("#filterSummary").textContent = count ? `Filters (${count} active)` : "Filters";
}

function syncUrl({pushUrl = false, view = MODE, card = null, node = null} = {}){
  const params = new URLSearchParams();
  const q = $("#q").value.trim();
  if (q) params.set("q", q);
  if (!$("#smartSearch").checked) params.set("smart", "0");
  if ($("#searchMode").value !== "balanced") params.set("mode", $("#searchMode").value);
  if ($("#side").value) params.set("side", $("#side").value);
  if ($("#source").value.trim()) params.set("source", $("#source").value.trim());
  if ($("#block").value.trim()) params.set("block", $("#block").value.trim());
  if (view !== "search") params.set("view", view);
  if (card) params.set("card", card);
  if (node) params.set("node", node);
  const next = `${location.pathname}${params.toString() ? "?" + params : ""}`;
  const method = pushUrl ? "pushState" : "replaceState";
  history[method]({search: q, view}, "", next);
}

function restoreUrlState(){
  const params = new URLSearchParams(location.search);
  $("#q").value = params.get("q") || "";
  $("#smartSearch").checked = params.get("smart") !== "0";
  $("#searchMode").value = ["strict", "balanced", "explore"].includes(params.get("mode"))
    ? params.get("mode") : "balanced";
  $("#side").value = ["aff", "neg", "unknown"].includes(params.get("side"))
    ? params.get("side") : "";
  $("#source").value = params.get("source") || "";
  $("#block").value = params.get("block") || "";
  updateFilterSummary();
  const detailView = params.get("card") || params.get("node");
  const view = detailView ? "search" : (["analysis", "sources", "board"].includes(params.get("view"))
    ? params.get("view") : "search");
  setMode(view, {updateUrl: false});
  if (params.get("card")) showCard(params.get("card"), {updateUrl: false});
  else if (params.get("node")) showNode(params.get("node"), {updateUrl: false});
}

window.addEventListener("popstate", () => restoreUrlState());

const RECENT_SEARCHES_KEY = "card-scraper:recent-searches";

function getRecentSearches(){
  try {
    const saved = JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY) || "[]");
    return Array.isArray(saved) ? saved.filter(x => typeof x === "string" && x.trim()).slice(0, 6) : [];
  } catch (_) { return []; }
}

function rememberSearch(query){
  const normalized = query.trim();
  if (!normalized) return;
  try {
    const next = [normalized, ...getRecentSearches().filter(x => x.toLowerCase() !== normalized.toLowerCase())].slice(0, 6);
    localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(next));
  } catch (_) { /* private browsing may deny storage; search still works */ }
}

function renderRecentSearches(target){
  const recent = getRecentSearches();
  if (!recent.length) return;
  const wrap = el("div", "recent-searches");
  const head = el("div", "recent-head");
  head.append(el("h3", null, "Recent searches"));
  const clear = el("button", "recent-clear", "Clear history");
  clear.type = "button";
  clear.onclick = () => {
    try { localStorage.removeItem(RECENT_SEARCHES_KEY); } catch (_) {}
    wrap.remove();
  };
  head.append(clear); wrap.append(head);
  const list = el("div", "recent-list");
  recent.forEach(query => {
    const button = el("button", "recent-query", query);
    button.type = "button";
    button.title = query;
    button.onclick = () => {
      $("#q").value = query;
      doSearch({pushUrl: true});
      $("#q").focus();
    };
    list.append(button);
  });
  wrap.append(list); target.append(wrap);
}

async function doSearch({pushUrl = false} = {}){
  const request = ++viewRequest;
  const q = $("#q").value.trim();
  if (!q){
    if (pushUrl) syncUrl({pushUrl: true});
    renderWelcome(); return;
  }
  rememberSearch(q);
  syncUrl({pushUrl});
  const side = $("#side").value;
  const source = $("#source").value.trim();
  const block = $("#block").value.trim();
  const c = $("#content");
  c.innerHTML = '<div class="spin">searching public evidence…</div>';
  const params = new URLSearchParams({ q, k: "25" });
  if (side) params.set("side", side);
  if (source) params.set("source", source);
  if (block) params.set("block", block);

/* ---------- tree ---------- */
const TREE_PAGE = 150;

async function loadTree(parent, container, depth, opts = {}){
  const { offset = 0, q = "" } = opts;
  const params = new URLSearchParams({ limit: TREE_PAGE, offset });
  if (parent) params.set("parent", parent);
  if (q) params.set("q", q);
  const r = await api(`/api/tree?${params}`);

  if (!parent && depth === 0){
    // The root level is one node per ingested file. At archive scale that is
    // ~12,000 of them, so it is paginated and filtered rather than dumped
    // into the DOM.
    const shown = Math.min(offset + r.nodes.length, r.total);
    $("#treecount").textContent = r.total
      ? `${shown} of ${r.total}` + (q ? ` matching "${q}"` : "")
      : (q ? `nothing matches "${q}"` : "");
  }

  for (const n of r.nodes){
    const row = el("div", "node" + (/^a\/?t:?\s/i.test(n.title) ? " at-node" : ""));
    const tw = el("span", "twisty", n.has_children ? "▸" : "");
    row.append(tw, el("span", "ttl", n.title));
    if (n.card_count) row.append(el("span", "cnt", n.card_count));
    container.append(row);
    const kids = el("div", "kids"); kids.hidden = true; container.append(kids);
    let loaded = false;
    row.onclick = async (ev) => {
      document.querySelectorAll(".node.sel").forEach(x => x.classList.remove("sel"));
      row.classList.add("sel");
      if (n.has_children){
        kids.hidden = !kids.hidden;
        tw.textContent = kids.hidden ? "▸" : "▾";
        if (!loaded && !kids.hidden){ loaded = true; await loadTree(n.node_id, kids, depth+1); }
      }
      showNode(n.node_id);
    };
  }

  const seen = offset + r.nodes.length;
  if (seen < r.total){
    const more = el("div", "more", `+ ${r.total - seen} more…`);
    more.onclick = async () => {
      more.remove();
      await loadTree(parent, container, depth, { offset: seen, q });
    };
    container.append(more);
  }
}

  }
  const health = s.health || {state: "unknown"};
  const healthLabels = {fresh: "Fresh", stale: "Stale", "refresh-failed": "Refresh failed", unknown: "Freshness unknown"};
  const age = health.age_days != null ? ` · ${health.age_days}d old` : "";
  n.append(el("div", "source-health", `${healthLabels[health.state] || health.state}${age}${s.fetched_at ? ` · fetched ${s.fetched_at}` : ""}`));

  const actions = el("div", "source-actions");
  const refresh = el("button", "board-btn", "Refresh"); refresh.type = "button";
  refresh.disabled = !s.url;
  refresh.onclick = async () => {
    refresh.disabled = true; refresh.textContent = "Queued…";
    try {
      const queued = await api(`/api/sources/${encodeURIComponent(s.source_id)}/refresh`, {method: "POST"});
      refresh.textContent = "Refreshing…";
      const poll = setInterval(async () => {
        try {
          const job = await api(`/api/ingest/${queued.job_id}`);
          if (!["completed", "failed", "cancelled"].includes(job.state)) return;
          clearInterval(poll);
          if (job.state === "completed") { await showCatalog(); }
          else { refresh.disabled = false; refresh.textContent = job.error || "Refresh failed"; }
        } catch (err) { clearInterval(poll); refresh.disabled = false; refresh.textContent = err.message || "Refresh failed"; }
      }, 700);
    } catch (err) { refresh.disabled = false; refresh.textContent = err.message || "Refresh failed"; }
  };
  const remove = el("button", "board-btn", "Remove"); remove.type = "button";
  remove.onclick = async () => {

  const request = ++viewRequest;
  const c = $("#content");
  c.innerHTML = '<div class="spin">loading analysis…</div>';
  try {
    if (!ANALYSIS) ANALYSIS = await api("/api/analysis");
  } catch (err) {
    if (request === viewRequest) showError(c, err);
    return;
  }
  if (request !== viewRequest) return;
  c.innerHTML = "";
  if (!ANALYSIS.available){
    const e = el("div", "empty");
    e.append(el("h2", null, "No analysis has been run yet."));
    e.append(el("p", null, ANALYSIS.hint || ""));
    e.append(el("p", null, "A model-backed run costs money and takes a few minutes, so it is never triggered automatically by opening this page."));
    c.append(e);
    return;
  }
  const s = ANALYSIS.stats || {};
  const bar = el("div", "abar");
  const add = (v, l) => { const d = el("div","astat"); d.append(el("b",null,String(v)), el("span",null,l)); bar.append(d); };
  add(s.positions_analyzed ?? 0, "positions");
  add(s.critical ?? 0, "critical");
  add(s.major ?? 0, "major");
  add(s.blocks_missing ?? 0, "blocks to cut");
  if (s.grounding) add(`${Math.round(s.grounding.grounded_rate*100)}%`, "grounded");
  add(ANALYSIS.llm_provider || "none", "model");
  c.append(bar);

  if (ANALYSIS.llm_usage) c.append(el("div", "crumb", ANALYSIS.llm_usage));

  (ANALYSIS.warnings || []).slice(0, 4).forEach(w =>
    c.append(el("div", "note", w)));

  if ((ANALYSIS.corpus_findings || []).length){
    c.append(el("h4", "sec", "Corpus-wide"));
    ANALYSIS.corpus_findings.forEach(f => c.append(findingEl(f)));
  }

  c.append(el("h4", "sec", "Positions, worst first"));
  (ANALYSIS.contentions || []).forEach(p => c.append(positionEl(p)));

  if ((ANALYSIS.generated_blocks || []).length){
    c.append(el("h4", "sec", "Answers you do not have"));
    ANALYSIS.generated_blocks.forEach(b => c.append(blockEl(b)));
  }
}

let MODE = "search";
let APP_STATS = null;
function setMode(m, {updateUrl = true} = {}){
  MODE = m;
  $("#mSearch").setAttribute("aria-pressed", String(m === "search"));
  $("#mAnalysis").setAttribute("aria-pressed", String(m === "analysis"));
  $("#mSources").setAttribute("aria-pressed", String(m === "sources"));
  $("#mBoard").setAttribute("aria-pressed", String(m === "board"));
  $("#tree").style.display = m === "search" ? "" : "none";
  document.body.classList.toggle("analysis", m === "analysis");
  document.querySelector("main").style.gridTemplateColumns =
    m === "search" ? "300px 1fr" : "1fr";
  if (updateUrl) syncUrl({view: m});
  if (m === "analysis") showAnalysis();
  else if (m === "sources") showCatalog();
  else if (m === "board") showBoard();
  else if ($("#q").value.trim()) doSearch();
  else renderWelcome();
}

function renderWelcome(){
  const c = $("#content");
  c.innerHTML = "";
  const e = el("div", "empty");
  const empty = !APP_STATS || !APP_STATS.cards;
  e.append(el("h2", null, empty
    ? "Your evidence index is empty."
    : "Search online speech-and-debate evidence."));
  const p1 = el("p", null, empty
    ? "Add local case files or a reviewed public release, then search exact text and debate concepts from one place."
    : "Searches combine exact text with semantic matching over read text, tags, citations, and public case releases. Use Smart Search for natural-language requests.");
  const p2 = el("p", null, "To add public evidence, run `cardgraph ingest local ./my-files` or `cardgraph ingest online <public index or file URL>` after checking its terms. Login-gated sources are intentionally not bypassed.");
  e.append(p1, p2);
  renderRecentSearches(e);
  c.append(e);
}

(async () => {
  try {
    const s = await api("/api/stats");
    APP_STATS = s;
    $("#stats").textContent =
      `${s.cards} cards · ${s.nodes} nodes · ${s.edges} edges · ${s.sources} sources`;
    await loadTree(null, $("#treebody"), 0);
  } catch (err) {
    showError($("#content"), err);
    $("#treebody").innerHTML = "";
    $("#treebody").append(el("div", "note", "The outline could not be loaded."));
  }
  let ft;
  $("#treeFilter").addEventListener("input", () => {
    clearTimeout(ft);
    ft = setTimeout(async () => {
      $("#treebody").innerHTML = "";
      try {
        await loadTree(null, $("#treebody"), 0,
                       { q: $("#treeFilter").value.trim() });
      } catch (err) {
        $("#treebody").append(el("div", "note", "Could not load the outline."));
      }
    }, 250);
  });
  $("#mSearch").onclick = () => setMode("search");
  $("#mAnalysis").onclick = () => setMode("analysis");
  $("#mSources").onclick = () => setMode("sources");
  $("#mBoard").onclick = () => setMode("board");
  savePinned();
  restoreUrlState();
})();
</script>
